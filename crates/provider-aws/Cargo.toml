[package]
name = "provider-aws"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "KeyProvider for EC2 without a TPM: AWS KMS envelope encryption / Secrets Manager via the instance IAM role."

[dependencies]
totp-core.workspace = true
zeroize.workspace = true
thiserror.workspace = true
# Default features of the aws-* crates use rustls (no native-tls / OpenSSL).
aws-config = "1"
aws-sdk-kms = "1"
aws-sdk-secretsmanager = "1"
tokio = { version = "1", features = ["rt"] }
