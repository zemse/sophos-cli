[package]
name = "sophos-cli"
description = "Sophos SSL VPN daemon with local CLI control and TOTP reconnect"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
include = ["src/**", "examples/**", "Cargo.toml", "README.md"]

[[bin]]
name = "sophos"
path = "src/main.rs"

[dependencies]
ghvpn-mgmt = { path = "../ghvpn-mgmt", version = "0.1.0" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
ring = "0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "io-util", "time", "sync", "fs", "signal"] }
zeroize = "1.9"
